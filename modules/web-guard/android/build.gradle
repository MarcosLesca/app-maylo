plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.webguard'
version = '0.1.0'

android {
  namespace "expo.modules.webguard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// Same androidx.webkit react-native-webview resolves (its webkitVersion, default 1.14.0).
def webkitVersion = rootProject.ext.has('webkitVersion') ? rootProject.ext.get('webkitVersion') : '1.14.0'

dependencies {
  implementation "androidx.webkit:webkit:${webkitVersion}"
}
