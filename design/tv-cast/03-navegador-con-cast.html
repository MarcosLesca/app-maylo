<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmitir a la TV — navegador con botón de transmitir</title>
<style>
  :root {
    --text:#1F1A17; --text-2:#6B6058; --bg:#FFF9F4; --el:#F6EEE6; --sel:#ECE1D6;
    --accent:#F26B3A; --on-accent:#2B1206; --accent-text:#A23D14; --accent-soft:#FFE3D3;
    --success:#4E9F3D; --success-text:#2F6B22; --success-soft:#E3F2DC;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#E9E2DB; font-family:var(--font); color:var(--text); }
  .stage { display:flex; gap:48px; padding:40px; justify-content:center; align-items:flex-start; }
  figure { margin:0; display:grid; gap:12px; justify-items:center; }
  figcaption { font-size:13px; color:var(--text-2); max-width:390px; text-align:center; }
  .phone { position:relative; width:390px; height:800px; border:10px solid #1F1A17; border-radius:40px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; }
  .status { height:28px; padding:6px 20px 0; font-size:12px; font-weight:600; display:flex; justify-content:space-between; }
  .bar { display:flex; align-items:center; gap:4px; padding:4px 8px 8px; }
  .icon-btn { width:44px; height:44px; border:0; background:none; border-radius:22px; display:grid; place-items:center; color:var(--text); cursor:pointer; flex:none; }
  .icon-btn.cast { color:var(--accent-text); background:var(--accent-soft); }
  .url { flex:1; min-width:0; display:flex; align-items:center; gap:6px; background:var(--el); border-radius:10px; padding:0 12px; height:40px; font-size:15px; color:var(--text); }
  .url span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn:focus-visible, .icon-btn:focus-visible, .tv:focus-visible, .pill:focus-visible { outline:3px solid var(--accent-text); outline-offset:2px; }

  /* Fake web page */
  .page { flex:1; background:#fff; overflow:hidden; color:#222; }
  .site { padding:12px 16px; font-weight:700; border-bottom:1px solid #eee; font-size:15px; }
  .player { position:relative; height:212px; background:linear-gradient(135deg,#2a2a2a,#555); display:grid; place-items:center; color:#fff; }
  .player .play { width:64px; height:64px; border-radius:32px; background:rgba(255,255,255,.2); display:grid; place-items:center; }
  .found { position:absolute; left:12px; bottom:12px; }
  .pill { border:0; display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:8px 14px; border-radius:20px; background:var(--accent); color:var(--on-accent); font:700 14px var(--font); cursor:pointer; }
  .meta { padding:16px; display:grid; gap:6px; }
  .meta h2 { font-size:20px; margin:0; }
  .meta p { margin:0; font-size:14px; color:#555; line-height:20px; }

  /* Bottom sheet */
  .scrim { position:absolute; inset:0; background:rgba(31,26,23,.45); }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--bg); border-radius:20px 20px 0 0; padding:8px 16px 24px; display:grid; gap:8px; }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--sel); justify-self:center; margin-bottom:8px; }
  .sheet h2 { font-size:18px; font-weight:700; margin:0; }
  .muted { color:var(--text-2); font-size:14px; line-height:20px; margin:0; }
  .video { display:flex; gap:12px; align-items:center; background:var(--el); border-radius:12px; padding:12px; }
  .thumb { width:64px; height:40px; border-radius:6px; background:linear-gradient(135deg,#2a2a2a,#555); flex:none; }
  .video strong { font-size:15px; display:block; }
  .video small { color:var(--text-2); font-size:13px; }
  .tv { width:100%; border:0; border-radius:12px; padding:14px 16px; background:var(--el); font-family:var(--font); color:var(--text); display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left; min-height:56px; }
  .tv .body { flex:1; display:grid; gap:2px; }
  .tv strong { font-size:16px; font-weight:600; }
  .tv small { font-size:13px; color:var(--text-2); }
  .tv.alt { background:none; border:1px solid var(--sel); }
  .searching { display:flex; align-items:center; gap:8px; color:var(--text-2); font-size:14px; padding:4px 4px; }
  .spin { width:16px; height:16px; border-radius:8px; border:2px solid var(--sel); border-top-color:var(--accent); animation:spin 1s linear infinite; }
  /* Playing: full remote inside the sheet */
  .state { display:inline-flex; align-items:center; gap:6px; background:var(--success-soft); color:var(--success-text); font-size:13px; font-weight:700; border-radius:10px; padding:4px 10px; justify-self:start; }
  .dot { width:8px; height:8px; border-radius:4px; background:var(--success); }
  .progress { display:grid; gap:4px; }
  .progress input { width:100%; accent-color:var(--accent); height:24px; margin:0; }
  .times { display:flex; justify-content:space-between; font-size:13px; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .controls { display:flex; justify-content:center; align-items:center; gap:24px; }
  .round { border:0; display:grid; place-items:center; cursor:pointer; position:relative; }
  .round.main { width:80px; height:80px; border-radius:40px; background:var(--accent); color:var(--on-accent); }
  .round.skip { width:60px; height:60px; border-radius:30px; background:var(--sel); color:var(--text); }
  .skip b { position:absolute; font-size:10px; font-weight:700; top:50%; left:50%; transform:translate(-50%,-38%); }
  .labels { display:flex; justify-content:center; gap:24px; font-size:13px; color:var(--text-2); }
  .labels span { width:60px; text-align:center; } .labels span.m { width:80px; }
  .vol { display:flex; align-items:center; gap:8px; background:var(--el); border-radius:12px; padding:8px; }
  .vol button { width:44px; height:44px; border:0; border-radius:10px; background:var(--sel); color:var(--text); display:grid; place-items:center; cursor:pointer; flex:none; }
  .level { flex:1; display:grid; gap:4px; }
  .level small { font-size:13px; color:var(--text-2); }
  .bar-level { height:6px; border-radius:3px; background:var(--sel); overflow:hidden; }
  .bar-level i { display:block; height:100%; width:18%; background:var(--accent); }
  .pair { display:flex; gap:8px; }
  .btn { flex:1; border:0; border-radius:10px; padding:10px 16px; min-height:44px; font:600 15px var(--font); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--sel); color:var(--text); }
  .round:focus-visible, .vol button:focus-visible, .progress input:focus-visible { outline:3px solid var(--accent-text); outline-offset:2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; border-top-color:var(--sel); border-right-color:var(--accent); } }
</style>
</head>
<body>
<div class="stage">
  <figure>
    <div class="phone" role="img" aria-label="Navegador dentro de la app con un video detectado">
      <div class="status" aria-hidden="true"><span>21:14</span><span>Wi-Fi 82%</span></div>
      <div class="bar">
        <button class="icon-btn" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="url" role="textbox" aria-label="Dirección"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6058" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>archive.org/details/night_of_the_living_dead</span></div>
        <button class="icon-btn cast" aria-label="Transmitir a la TV"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M8 2l4 4 4-4"/><path d="M8 22h8"/></svg></button>
      </div>
      <div class="page">
        <div class="site">Internet Archive</div>
        <div class="player">
          <div class="play" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="found"><button class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>Ver en la tele</button></div>
        </div>
        <div class="meta">
          <h2>Night of the Living Dead (1968)</h2>
          <p>Dominio público · 1 h 36 min</p>
          <p>Película completa disponible para ver y descargar.</p>
        </div>
      </div>
    </div>
    <figcaption>Navegás como en Chrome. Cuando la app detecta un video en la página, aparece “Ver en la tele” sobre el reproductor.</figcaption>
  </figure>

  <figure>
    <div class="phone" role="img" aria-label="Hoja para elegir la TV a la que transmitir">
      <div class="status" aria-hidden="true"><span>21:14</span><span>Wi-Fi 82%</span></div>
      <div class="bar">
        <button class="icon-btn" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="url"><span>archive.org/details/night_of_the_living_dead</span></div>
        <button class="icon-btn cast" aria-label="Transmitir a la TV"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M8 2l4 4 4-4"/><path d="M8 22h8"/></svg></button>
      </div>
      <div class="page"><div class="site">Internet Archive</div><div class="player"></div></div>
      <div class="scrim" aria-hidden="true"></div>
      <section class="sheet" role="dialog" aria-label="Transmitir a">
        <div class="grab" aria-hidden="true"></div>
        <h2>Ver en la tele</h2>
        <div class="video">
          <div class="thumb" aria-hidden="true"></div>
          <div><strong>Night of the Living Dead (1968)</strong><small>Video MP4 · 1 encontrado en la página</small></div>
        </div>
        <button class="tv">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A23D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M8 2l4 4 4-4"/><path d="M8 22h8"/></svg>
          <span class="body"><strong>Hisense 50A4NV</strong><small>Living</small></span>
        </button>
        <div class="searching" role="status"><span class="spin" aria-hidden="true"></span>Buscando otras teles en tu Wi-Fi…</div>
        <button class="tv alt">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B6058" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          <span class="body"><strong>Duplicar la pantalla</strong><small>Si el video no anda: muestra todo el teléfono en la tele</small></span>
        </button>
      </section>
    </div>
    <figcaption>Tocás “Ver en la tele” y aparece una hoja con tus teles, igual que el botón de YouTube. “Duplicar la pantalla” queda como plan B.</figcaption>
  </figure>

  <figure>
    <div class="phone" role="img" aria-label="Hoja con el control remoto mientras el video se ve en la tele">
      <div class="status" aria-hidden="true"><span>21:16</span><span>Wi-Fi 82%</span></div>
      <div class="bar">
        <button class="icon-btn" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="url"><span>archive.org/details/night_of_the_living_dead</span></div>
        <button class="icon-btn cast" aria-label="Transmitiendo a Hisense 50A4NV"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M8 2l4 4 4-4"/><path d="M8 22h8"/></svg></button>
      </div>
      <div class="page"><div class="site">Internet Archive</div><div class="player"></div></div>
      <div class="scrim" aria-hidden="true"></div>
      <section class="sheet" role="dialog" aria-label="Control remoto">
        <div class="grab" aria-hidden="true"></div>
        <span class="state"><span class="dot" aria-hidden="true"></span>Reproduciendo en Hisense 50A4NV</span>
        <div class="video">
          <div class="thumb" aria-hidden="true"></div>
          <div><strong>Night of the Living Dead (1968)</strong><small>Video MP4</small></div>
        </div>
        <div class="progress">
          <input type="range" min="0" max="5760" value="724" aria-label="Posición del video" aria-valuetext="12 minutos 4 segundos de 1 hora 36 minutos">
          <div class="times" aria-hidden="true"><span>12:04</span><span>1:36:00</span></div>
        </div>
        <div class="controls">
          <button class="round skip" aria-label="Retroceder 10 segundos"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/></svg><b aria-hidden="true">10</b></button>
          <button class="round main" aria-label="Pausar"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
          <button class="round skip" aria-label="Adelantar 10 segundos"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/></svg><b aria-hidden="true">10</b></button>
        </div>
        <div class="labels" aria-hidden="true"><span>−10 s</span><span class="m">Pausa</span><span>+10 s</span></div>
        <div class="vol" role="group" aria-label="Volumen de la tele">
          <button aria-label="Silenciar" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6"/><path d="M21 9l-4 6"/></svg></button>
          <div class="level"><small>Volumen 18</small><div class="bar-level" aria-hidden="true"><i></i></div></div>
          <button aria-label="Bajar volumen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button aria-label="Subir volumen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
        </div>
        <div class="pair">
          <button class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Detener</button>
          <button class="btn">Elegir otra tele</button>
        </div>
      </section>
    </div>
    <figcaption>Después de elegir la tele, la misma hoja se vuelve control remoto: progreso, ±10 s, pausa y volumen. Cerrala y volvé con el botón de la tele de arriba.</figcaption>
  </figure>
</div>
</body>
</html>
