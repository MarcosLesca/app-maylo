# Publishes an over-the-air update on every push to main.
# Phones running the same app version download it on next launch.
name: OTA update

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - '.github/workflows/supabase-keep-alive.yml'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

concurrency:
  group: ota-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in EXPO_TOKEN SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update --branch production --message "${COMMIT_MESSAGE:-Manual update}" --non-interactive
